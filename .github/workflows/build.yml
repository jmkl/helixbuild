
name: Build Helix Steel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Steel Helix
        uses: actions/checkout@v4
        with:
          repository: mattwparas/helix
          ref: steel-event-system
          fetch-depth: 1

      - name: Set git config for long paths
        run: git config --system core.longpaths true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Get commit information
        id: commit
        shell: pwsh
        run: |
          $HASH = git rev-parse --short HEAD
          $MESSAGE = git log -1 --format=%s
          "HASH=$HASH" >> $env:GITHUB_OUTPUT
          "MESSAGE=$MESSAGE" >> $env:GITHUB_OUTPUT

      - name: Build Helix with Steel
        run: cargo build --release --locked -p helix-term --features steel,git --bin hx

      - name: Prepare release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/hx.exe dist/hx.exe

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/hx.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-steel-windows-${{ steps.commit.outputs.HASH }}
          path: dist/hx.exe

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          name: Helix Steel Nightly
          body: |
            Automated Windows build of mattwparas/helix.

            Branch: steel-event-system
            Commit: ${{ steps.commit.outputs.HASH }}
            Message: ${{ steps.commit.outputs.MESSAGE }}

          tag_name: nightly
          prerelease: true
          make_latest: false
          files: dist/hx.exe
